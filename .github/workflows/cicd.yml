name: CI/CD

on:
  push:
    branches: [main]

jobs:
  ci:
    name: Build e Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar nome da imagem em lowercase
        id: meta
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

  cd:
    name: Deploy no Kubernetes
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar nome da imagem em lowercase
        id: meta
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Configurar contexto do cluster
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Aplicar manifests
        uses: azure/k8s-deploy@v5
        with:
          namespace: kube-news
          manifests: k8s/app.yaml
          images: ${{ steps.meta.outputs.image }}

      - name: Verificar rollout
        run: kubectl rollout status deployment/kube-news-app -n kube-news --timeout=180s
